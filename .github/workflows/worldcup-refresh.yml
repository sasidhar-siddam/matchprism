# Daily World Cup data refresh.
#
# Free steps (fixtures + news) always run. The Claude steps (digest,
# articles, editor pass) run only when a CLAUDE_CODE_OAUTH_TOKEN secret is
# configured (create one locally with `claude setup-token`, then add it in
# repo Settings -> Secrets -> Actions). They are non-fatal: if Claude is
# unavailable the free data still refreshes and the digest script falls
# back to rule-based output.
#
# NOTE: pushing refreshed JSON triggers Vercel only if the project is
# connected to this repo. The cricket pages still need locally-built
# data/processed (90 MB, not in git), so until that moves to CI this
# workflow's job is to keep data/processed/worldcup fresh in the repo —
# pull before your next local build + deploy.

name: worldcup-refresh

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily, after the last Americas kickoffs finish
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fixtures and news (free)
        run: |
          python scripts/worldcup_fetch_fixtures.py
          python scripts/worldcup_fetch_news.py

      - name: Install Claude Code CLI
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate digest, articles, editor pass (3 sonnet calls)
        if: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/worldcup_generate_digest.py
          python scripts/worldcup_generate_articles.py
          python scripts/worldcup_edit_articles.py

      - name: Commit refreshed data
        run: |
          git config user.name "worldcup-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/worldcup/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "refresh World Cup data ($(date -u +%Y-%m-%d))"
            git push
          fi
